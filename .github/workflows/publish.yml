name: Publish

# Triggered by pushing a version tag (v0.1.0, v0.2.0, ...), not by every
# push to main — publishing is a deliberate, versioned act, not tied to
# commit cadence.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@tesronae"

      - run: npm ci

      - name: verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

      - name: publish
        run: npm publish
        env:
          # GitHub Packages accepts the workflow's own GITHUB_TOKEN for
          # publishing to its own org's registry — no stored npm token,
          # same no-stored-secret shape as IMS's OIDC-based Azure login.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
